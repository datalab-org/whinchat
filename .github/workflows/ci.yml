name: CI tests
on:
  pull_request:

  push:
    branches:
      - main

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run linters and other pre-commit hooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked --all-extras --dev

      - name: Run pre-commit
        run: |
          uv run pre-commit run --all-files --show-diff-on-failure

  pytest:
    name: Run Python unit tests

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v5
        with:
          # tests need an unshallowed version of the repository to check the version
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked versions of dependencies
        run: |
          uv sync --locked --all-extras --dev

      - name: Run all tests
        run: |
          uv run pytest -rs -vvv ./tests

  datalab-install:
    name: Install alongside datalab
    runs-on: ubuntu-latest

    env:
      # datalab ref to install into; webapp manifest collection requires a
      # version of datalab that supports plugin manifests
      DATALAB_REF: ml-evs/block-vue

    steps:
      - uses: actions/checkout@v5
        with:
          path: whinchat
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: datalab-org/datalab
          ref: ${{ env.DATALAB_REF }}
          path: datalab
          # setuptools_scm needs the history to version datalab-server
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Plugins with webapp dependencies are installed with yarn by `invoke dev.install`
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Write plugins.toml
        run: |
          cat > datalab/plugins.toml <<EOF
          dependencies = ["whinchat"]

          [tool.uv.sources]
          whinchat = { path = "../whinchat" }
          EOF

      - name: Install datalab with plugins
        working-directory: datalab/pydatalab
        run: |
          uv sync --locked --all-extras --dev
          uv run invoke dev.install

      - name: Check the chat block is loaded from the plugin
        working-directory: datalab/pydatalab
        # --no-sync: a plain `uv run` would re-sync and uninstall the plugin
        run: |
          uv run --no-sync python - <<EOF
          from pydatalab.apps import BLOCK_TYPES, load_block_plugins

          plugins = load_block_plugins()
          assert plugins["chat"].__module__ == "whinchat.blocks", plugins
          assert "chat" in BLOCK_TYPES
          EOF

      - name: Check the webapp component was collected
        run: |
          test -f datalab/webapp/src/plugins/whinchat/ChatBlock.vue
          grep -F 'import whinchat from "./whinchat/index.js";' datalab/webapp/src/plugins/panels.generated.js
          # the plugin's npm dependencies were installed as a yarn workspace
          test -L datalab/webapp/node_modules/whinchat-webapp
          test -d datalab/webapp/node_modules/markdown-it
